      bbcode_help: Włącz lub wyłącz niestandardowe tagi BBCode do renderowania stron. Zmiany wymagają wyczyszczenia cache formattera (php flarum cache:clear).
      bbcode_table: "[table] [tr] [th] [td] — Tabele"
